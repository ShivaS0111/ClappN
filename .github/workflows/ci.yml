name: ClappN CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: .

jobs:
  unit:
    name: Unit & slice tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compile
        run: ./mvnw -B -DskipTests compile

      - name: Unit tests (exclude thorough, accumulate coverage)
        run: ./mvnw -B test -Dgroups=!thorough

      - name: Upload JaCoCo exec for thorough job
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-unit
          path: target/jacoco.exec
          retention-days: 1

  thorough-security:
    name: Thorough security suites (MySQL)
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
      actions: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin123
          MYSQL_DATABASE: clapp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Download unit JaCoCo exec
        uses: actions/download-artifact@v4
        with:
          name: jacoco-exec-unit
          path: target/

      - name: Thorough security ITs + coverage gate
        run: >
          ./mvnw -B test
          -Pthorough
          -Dtest=FullApiRoleAuthzIT,TenantIsolationIT,AuthFullIT,CrudIdorProductsIT,TemplateCatalogAdminIT,IndirectIntegrityIT,ServerSideQaReportIT
          verify
          -Pcoverage-gate

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thorough-qa-reports
          path: |
            reports/
            target/*-report.*
          if-no-files-found: warn
          retention-days: 14
