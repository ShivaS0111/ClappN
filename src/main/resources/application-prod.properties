# Production profile — harden surface area; schema only via Flyway

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-missing-migrations=false

# Fail closed: JWT secret must be provided (no default) and strong
app.jwt.secret=${JWT_SECRET}
app.jwt.require-strong-secret=true
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# No Swagger / OpenAPI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.security.swagger-enabled=false

# Seed: keep RBAC catalog aligned; never invent demo businesses/stores
app.seed.enabled=true
app.seed.demo-data=false
app.seed.rbac-align=true

# CORS — required env (comma-separated origins)
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# Errors: never leak stack/messages to clients
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logging — JSON via logback-spring.xml (prod profile)
logging.level.root=INFO
logging.level.biz.craftline.server=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.level.biz.craftline.server.config.observability=INFO

# Actuator on separate management port (bind only on private network / localhost in real deploys)
management.server.port=${MANAGEMENT_PORT:9091}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,300ms,1s,2s,5s
app.observability.slow-request-ms=${APP_SLOW_REQUEST_MS:1500}

# Payments — real secrets required for each enabled provider (fail-fast at startup)
app.payments.require-webhook-verification=true
payment.stripe.secret=${STRIPE_SECRET:}
payment.stripe.publishable=${STRIPE_PUBLISHABLE:}
payment.stripe.webhook_secret=${STRIPE_WEBHOOK_SECRET:}
payment.stripe.success-url=${PAYMENT_STRIPE_SUCCESS_URL}
payment.stripe.cancel-url=${PAYMENT_STRIPE_CANCEL_URL}
payment.razorpay.key_id=${RAZORPAY_KEY_ID:}
payment.razorpay.key_secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:}
app.payments.enabled-providers=${APP_PAYMENT_PROVIDERS:stripe,razorpay}