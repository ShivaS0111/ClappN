spring.application.name=server
server.port=9090
spring.profiles.active=dev

# HTTP / API defaults (production-safe; profiles may tighten further)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD:10MB}
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD:10MB}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# OpenAPI (disabled in prod profile)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}

# Flyway configuration (shared defaults; profiles may override)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — override JWT_SECRET in every non-local environment
app.jwt.secret=${JWT_SECRET:myVerySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong}
app.jwt.expiration=${JWT_EXPIRATION:604800000}
app.jwt.require-strong-secret=${APP_JWT_REQUIRE_STRONG:false}

# CORS (comma-separated). Prod must set APP_CORS_ORIGINS to real frontends.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5176}
app.security.swagger-enabled=${APP_SWAGGER_ENABLED:true}

# Seed: RBAC align is safe; demo business/store data is not for prod
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.demo-data=${APP_SEED_DEMO_DATA:true}
app.seed.rbac-align=${APP_SEED_RBAC_ALIGN:true}

# Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,300ms,1s,2s,5s
info.app.name=ClappN
info.app.env=${spring.profiles.active}
app.observability.slow-request-ms=${APP_SLOW_REQUEST_MS:2000}

logging.level.root=INFO
logging.level.biz.craftline.server=INFO
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n

# Payments — always from env in real deployments
# Dev: placeholders OK; webhook verification skipped when secret is placeholder
app.payments.require-webhook-verification=${APP_PAYMENTS_REQUIRE_WEBHOOK_VERIFICATION:false}
app.payments.enabled-providers=${APP_PAYMENT_PROVIDERS:stripe,razorpay}
payment.stripe.secret=${STRIPE_SECRET:sk_test_YOUR_STRIPE_SECRET}
payment.stripe.publishable=${STRIPE_PUBLISHABLE:pk_test_YOUR_STRIPE_PUB}
payment.stripe.success-url=${PAYMENT_STRIPE_SUCCESS_URL:http://localhost:5173/payment/callback}
payment.stripe.cancel-url=${PAYMENT_STRIPE_CANCEL_URL:http://localhost:5173/payment/callback}
payment.razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
payment.razorpay.key_secret=${RAZORPAY_KEY_SECRET:YOUR_RAZORPAY_SECRET}
payment.stripe.webhook_secret=${STRIPE_WEBHOOK_SECRET:whsec_TEST}
payment.razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:razorpay_test_secret}

# Mail
app.mail.mode=${APP_MAIL_MODE:log}
app.mail.from=${APP_MAIL_FROM:noreply@clapp.local}
app.frontend.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
