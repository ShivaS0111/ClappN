spring.application.name=server
server.port=9090
spring.profiles.active=dev


# OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Flyway configuration (shared defaults; profiles may override)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Configuration
app.jwt.secret=${JWT_SECRET:myVerySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# Note: environment-specific datasource/JPA/Flyway settings are in application-dev.properties and application-prod.properties

logging.level.root=INFO
logging.level.biz.craftline.server=DEBUG
logging.file.name=logs/app.log


# Replace these with your sandbox/test keys
payment.stripe.secret=sk_test_YOUR_STRIPE_SECRET
payment.stripe.publishable=pk_test_YOUR_STRIPE_PUB
payment.razorpay.key_id=rzp_test_YOUR_KEY_ID
payment.razorpay.key_secret=YOUR_RAZORPAY_SECRET

# webhook verification secrets (set them if you use real webhooks)
payment.stripe.webhook_secret=whsec_TEST
payment.razorpay.webhook_secret=razorpay_test_secret

# Mail: log = LoggingMailService (default); smtp = JavaMailSender
app.mail.mode=${APP_MAIL_MODE:log}
app.mail.from=${APP_MAIL_FROM:noreply@clapp.local}
app.frontend.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

