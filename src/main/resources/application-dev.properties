# Development profile (default via spring.profiles.active=dev)

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/clapp
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Dev convenience: Hibernate can add columns while iterating; Flyway remains source of truth for shared changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway: full V1–Vn chain lives under classpath:db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true
# After restoring missing scripts, validate checksums. If an old DB fails checksum, run once:
#   mvnw flyway:repair
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-missing-migrations=false
