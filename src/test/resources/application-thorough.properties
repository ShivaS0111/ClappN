# Profile for ThoroughSystemFeatureIT (hits local MySQL like dev)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/clapp
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=true

server.port=0
spring.mail.host=localhost
spring.main.allow-bean-definition-overriding=true

app.seed.enabled=true
app.seed.demo-data=true
app.seed.rbac-align=true
app.security.swagger-enabled=true
app.jwt.require-strong-secret=false
app.cors.allowed-origins=http://localhost:5173
